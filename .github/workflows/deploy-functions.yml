# Sender serverfunktionerne (notifikationer og analyse) til Supabase, når de ændres.
# Kræver repo-hemmeligheden SUPABASE_ACCESS_TOKEN (se docs/OPSAETNING.md, trin 3).
name: Deploy Supabase-funktioner

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", "supabase/config.toml", ".github/workflows/deploy-functions.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: zkicdizuvkkcjowbvrvj
    steps:
      - name: Tjek at nøglen er sat
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN mangler. Se docs/OPSAETNING.md, trin 3. Funktionerne er ikke sendt."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.ok == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ok == 'true'
        with:
          version: latest
      - if: steps.check.outputs.ok == 'true'
        run: supabase functions deploy notify --project-ref "$PROJECT_REF" --yes
      - if: steps.check.outputs.ok == 'true'
        run: supabase functions deploy analyze-notes --project-ref "$PROJECT_REF" --yes
