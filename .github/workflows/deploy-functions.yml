# Sender serverfunktionerne (notifikationer og analyse) til Supabase, når de ændres.
# Kræver repo-hemmeligheden SUPABASE_ACCESS_TOKEN (se docs/OPSAETNING.md, trin 3).
name: Deploy Supabase-funktioner

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", "supabase/config.toml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: zkicdizuvkkcjowbvrvj
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy notify --project-ref "$PROJECT_REF"
      - run: supabase functions deploy analyze-notes --project-ref "$PROJECT_REF"
