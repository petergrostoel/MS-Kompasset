<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MS Kompasset</title>
  <meta name="theme-color" content="#ECE6D9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1B1D16" media="(prefers-color-scheme: dark)">
  <!-- iPhone: kør som app fra hjemmeskærmen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MS Kompasset">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- Logo og ikoner ligger i branding/ og kan udskiftes uden at ændre koden -->
  <link rel="apple-touch-icon" href="branding/icon-180.png">
  <link rel="icon" href="branding/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=Figtree:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ---------- Login ---------- -->
  <section id="auth-view" class="auth" hidden>
    <div class="brand">
      <img src="branding/logo.png" alt="">
      <h1>MS Kompasset</h1>
      <p class="muted" style="margin:0">Log ind for at se jeres overblik.</p>
    </div>
    <form id="auth-form" class="card" autocomplete="on">
      <label class="field">E-mail<input name="email" type="email" required autocomplete="username" inputmode="email"></label>
      <label class="field">Adgangskode<input name="password" type="password" required minlength="8" autocomplete="current-password"></label>
      <div class="btnrow">
        <button type="submit" class="btn" data-mode="signin">Log ind</button>
        <button type="submit" class="btn ghost" data-mode="signup">Opret konto</button>
      </div>
      <p id="auth-msg" class="msg" role="status"></p>
    </form>
  </section>

  <!-- ---------- Første gang: hvem er du, og fælles hjem ---------- -->
  <section id="setup-view" class="auth" hidden></section>

  <!-- ---------- Appen ---------- -->
  <div class="app" id="app" hidden>
    <header class="top">
      <button class="logo" data-go="home" aria-label="Til forsiden">
        <img src="branding/logo.png" alt="">
        MS Kompasset
      </button>
      <span class="sp"></span>
      <span id="sync" class="sync" role="status"></span>
      <button class="iconbtn" data-go="settings" aria-label="Indstillinger">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </header>
    <main id="view"></main>
    <nav class="nav"><div class="in" id="nav"></div></nav>
  </div>

  <div class="scrim" id="scrim" data-act="closeSheet"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
